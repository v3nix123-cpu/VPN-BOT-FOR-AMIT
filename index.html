<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020a1f">
    <title>PHANTOM VPN ZONE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --p: #3b82f6;
            --p2: #1d4ed8;
            --cy: #38bdf8;
            --deep: #020a1f;
            --glass: rgba(20, 52, 120, 0.30);
            --glass-hi: rgba(255, 255, 255, 0.08);
            --line: rgba(125, 170, 255, 0.20);
            --text: #eaf2ff;
            --muted: #93a9cf;
        }
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #020a1f; }
        body {
            background: linear-gradient(180deg, #051636 0%, #020a1f 55%, #010510 100%);
            min-height: 100vh;
            color: var(--text);
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* Anti-lag ambient background: 2 gradient layers moved with transform only (GPU), no canvas, no blur filter */
        #bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; contain: layout paint; }
        #bg-glow i { position: absolute; width: 120vmax; height: 120vmax; border-radius: 50%; will-change: transform; transform: translate3d(0,0,0); }
        #bg-glow i:nth-child(1) { top: -72vmax; right: -62vmax; background: radial-gradient(circle, rgba(37, 99, 235, 0.42), transparent 62%); animation: drift1 28s ease-in-out infinite alternate; }
        #bg-glow i:nth-child(2) { bottom: -78vmax; left: -72vmax; background: radial-gradient(circle, rgba(14, 165, 233, 0.26), transparent 62%); animation: drift2 34s ease-in-out infinite alternate; }
        @keyframes drift1 { to { transform: translate3d(-8vmax, 10vmax, 0); } }
        @keyframes drift2 { to { transform: translate3d(10vmax, -8vmax, 0); } }
        @media (prefers-reduced-motion: reduce) { #bg-glow i { animation: none; } }

        .max-w-md, header, main, nav, .modal { position: relative; z-index: 1; }
        header h1 { color: #fff; text-shadow: 0 0 26px rgba(59, 130, 246, 0.55); }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a2a6b 0%, #020a1f 60%, #010510 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            color: #fff;
        }
        .loader-ring {
            width: 54px;
            height: 54px;
            border: 4px solid rgba(255,255,255,0.12);
            border-top: 4px solid #60a5fa;
            border-right: 4px solid rgba(96, 165, 250, 0.55);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Glass card */
        .card {
            background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03)), var(--glass);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            backdrop-filter: blur(14px) saturate(150%);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--line);
            position: relative;
            box-shadow: 0 14px 34px -16px rgba(0, 8, 30, 0.9), inset 0 1px 0 rgba(255,255,255,0.16);
            color: var(--text);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 38%, rgba(56,189,248,0.07));
        }
        .card > * { position: relative; z-index: 1; }
        /* Nested/long lists: skip blur so scrolling stays smooth */
        .sheet .card, #admin-panel .card, #vpn-list .card, #user-orders .card { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03)), rgba(16, 44, 104, 0.55); }

        .btn-p {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 55%, #1e3a8a 100%);
            color: #fff;
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 12px 26px -12px rgba(59, 130, 246, 0.85), inset 0 1px 0 rgba(255,255,255,0.22);
            border: 1px solid rgba(255,255,255,0.14);
            transition: transform .2s ease;
        }
        .btn-p:active { transform: scale(0.98); }
        .btn-reject {
            background: rgba(244, 63, 94, 0.12);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.28);
            width: 100%;
            padding: 12px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 12px;
        }

        .acc-box {
            background: rgba(2, 10, 31, 0.45);
            border: 1.5px dashed rgba(125, 170, 255, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .acc-label { font-size: 9px; font-weight: 800; color: #93c5fd; text-transform: uppercase; letter-spacing: 0.5px; }
        .acc-value { font-family: 'monospace'; font-size: 11px; font-weight: 700; color: #fff; }

        .adm-nav { display: flex; background: rgba(2, 10, 31, 0.5); padding: 5px; border-radius: 18px; margin-bottom: 15px; gap: 4px; overflow-x: auto; border: 1px solid var(--line); }
        .adm-tab { flex: 1; min-width: 90px; padding: 12px 8px; font-size: 10px; font-weight: 800; color: var(--muted); border-radius: 14px; text-align: center; white-space: nowrap; }
        .adm-tab-active { background: linear-gradient(135deg, #3b82f6, #1e40af); color: #fff; box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35); }

        .modal { position: fixed; inset: 0; background: rgba(1, 6, 20, 0.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 6000; display: none; align-items: flex-end; justify-content: center; }
        .sheet {
            background: linear-gradient(180deg, rgba(22, 56, 128, 0.78) 0%, rgba(4, 14, 40, 0.96) 100%);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            width: 100%;
            max-width: 450px;
            border-radius: 35px 35px 0 0;
            padding: 30px;
            animation: slideUp 0.3s;
            max-height: 85vh;
            overflow-y: auto;
            color: #fff;
            border: 1px solid var(--line);
            border-bottom: 0;
            box-shadow: 0 -18px 50px rgba(37, 99, 235, 0.18), inset 0 1px 0 rgba(255,255,255,0.14);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .adm-mini-input {
            width: 100%;
            background: rgba(2, 10, 31, 0.45);
            border: 1px solid rgba(125, 170, 255, 0.24);
            border-radius: 12px;
            padding: 10px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
            color: #fff;
        }
        .adm-mini-input option { background: #07183f; color: #fff; }
        .adm-mini-input::placeholder, #trx-id::placeholder { color: rgba(234, 242, 255, 0.4); }
        .adm-mini-input:focus, #trx-id:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16); }

        .vpn-img, .pay-logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            object-fit: contain;
            padding: 4px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(147, 197, 253, 0.35);
            box-shadow: 0 8px 18px rgba(0, 8, 30, 0.35);
        }
        .logo-img { object-fit: contain; background: rgba(255,255,255,0.94); padding: 3px; border: 1px solid rgba(147,197,253,0.35); }
        .logo-up {
            flex: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(59, 130, 246, 0.18);
            border: 1px solid rgba(125, 170, 255, 0.35);
            color: #93c5fd;
            cursor: pointer;
        }
        .disabled-card { opacity: 0.45; pointer-events: none; filter: grayscale(1); }

        .pay-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 14px 10px;
            min-height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
        }
        .pay-card:active, .pay-card.active { transform: scale(0.97); border-color: #60a5fa; background: rgba(59, 130, 246, 0.2); }
        .pay-logo-wrap { width: 46px; height: 46px; position: relative; display: grid; place-items: center; }
        .pay-logo-wrap .pay-logo { width: 46px; height: 46px; border-radius: 14px; }
        .pay-logo-fallback {
            display: none;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            place-items: center;
            background: linear-gradient(135deg, #3b82f6, #1e3a8a);
            color: #fff;
            font-weight: 900;
            border: 1px solid rgba(255,255,255,0.14);
        }
        .active-method-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.16);
            border: 1px solid rgba(125, 170, 255, 0.3);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #1e3a6e; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(14px); }

        nav { background: rgba(4, 16, 46, 0.72) !important; -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); border-color: var(--line) !important; box-shadow: 0 -12px 32px rgba(0, 8, 30, 0.5), inset 0 1px 0 rgba(255,255,255,0.08); }
        #admin-panel { background: linear-gradient(180deg, #051636 0%, #020a1f 100%) !important; color: #fff; }
        #user-profile-card { background: linear-gradient(135deg, rgba(30, 64, 175, 0.85) 0%, rgba(37, 99, 235, 0.55) 55%, rgba(56, 189, 248, 0.4) 100%) !important; border: 1px solid rgba(255,255,255,0.18) !important; box-shadow: 0 22px 44px -22px rgba(37, 99, 235, 0.9), inset 0 1px 0 rgba(255,255,255,0.25) !important; }
        #trx-id { background: rgba(2, 10, 31, 0.45); border-color: rgba(125, 170, 255, 0.3); color: #fff; }
        hr { border-color: rgba(125, 170, 255, 0.2); }

        /* Remap the light-theme utility classes used in the markup to glass */
        .bg-white, .bg-slate-50, .bg-slate-100 { background-color: rgba(255, 255, 255, 0.06) !important; color: #fff !important; }
        .bg-indigo-50 { background-color: rgba(59, 130, 246, 0.16) !important; color: #fff !important; border: 1px solid rgba(125, 170, 255, 0.26); }
        .text-indigo-600, .text-indigo-700, .text-indigo-500, .text-indigo-400 { color: #60a5fa !important; }
        .text-slate-400, .text-slate-500, .text-slate-600 { color: #93a9cf !important; }
        .text-emerald-500, .text-emerald-600 { color: #34d399 !important; }
        .bg-emerald-50 { background-color: rgba(52, 211, 153, 0.14) !important; }
        .bg-rose-50 { background-color: rgba(244, 63, 94, 0.14) !important; }
        .border, .border-t, .border-b, .border-2 { border-color: rgba(125, 170, 255, 0.22) !important; }

        .admin-empty {
            padding: 20px;
            border: 1px dashed rgba(125, 170, 255, 0.3);
            border-radius: 18px;
            text-align: center;
            color: #93a9cf;
            font-size: 11px;
            font-weight: 800;
            background: rgba(255,255,255,0.04);
        }
        .admin-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
            border: 1px solid rgba(125, 170, 255, 0.28);
        }

        /* Admin panel must stay above user panel and nav. */
        #admin-panel {
            position: fixed !important;
            inset: 0 !important;
            z-index: 9000 !important;
            width: 100% !important;
            height: 100vh !important;
        }
        #admin-panel.hidden { display: none !important; }
        #admin-panel:not(.hidden) { display: flex !important; }
        #admin-btn-nav { pointer-events: auto !important; position: relative; z-index: 1100; }

        .swal2-popup { background: rgba(6, 22, 58, 0.94) !important; color: #fff !important; border: 1px solid var(--line); border-radius: 24px !important; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
        .swal2-confirm { background: linear-gradient(135deg, #3b82f6, #1e40af) !important; border-radius: 14px !important; }
        .swal2-cancel { background: rgba(255,255,255,0.12) !important; border-radius: 14px !important; }
    </style>
</head>
<body>

    <div id="bg-glow"><i></i><i></i></div>

    <div id="loading-screen">
        <div class="loader-ring"></div>
        <p class="mt-4 font-bold text-slate-400 text-sm tracking-widest animate-pulse uppercase">Phantom VPN Zone</p>
    </div>

    <div class="max-w-md mx-auto">
        <header class="p-6 flex justify-between items-center">
            <h1 class="font-black text-2xl tracking-tighter italic">PHANTOM<span class="text-indigo-600">VPN-ZONE</span></h1>
            <div id="p-count-badge" class="hidden bg-rose-500 text-white text-[10px] font-black px-2 py-1 rounded-full animate-bounce">0</div>
        </header>

        <main class="p-5 space-y-5">
            <div id="user-profile-card" class="card bg-gradient-to-br from-indigo-600 to-blue-700 border-none p-7 text-white shadow-2xl shadow-indigo-200">
                <div class="flex items-center gap-5">
                    <img id="u-pic" class="w-16 h-16 rounded-[22px] border-2 border-white/30 shadow-lg" src="">
                    <div>
                        <h2 id="u-nickname" class="text-xl font-black tracking-tight">...</h2>
                        <p id="display-uid" class="text-[10px] font-bold opacity-70 tracking-widest mt-1 uppercase"></p>
                    </div>
                </div>
            </div>

            <div id="store-page" class="page-content space-y-4">
                <div class="card flex items-center justify-between">
                    <div><p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Wallet balance</p><p class="text-2xl font-black">৳<span id="u-bal">0</span></p></div>
                    <button onclick="openDeposit()" class="btn-p" style="width:auto;padding:12px 22px;font-size:12px">Add money</button>
                </div>
                <div id="vpn-list" class="space-y-3"></div>
            </div>

            <div id="history-page" class="page-content hidden space-y-3">
                <h3 class="font-black text-lg mb-2">My Orders</h3>
                <div id="user-orders" class="space-y-3"></div>
            </div>

            <div id="help-page" class="page-content hidden text-center card py-12">
                <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-5"><i class="fa-brands fa-telegram text-5xl text-indigo-500"></i></div>
                <h4 class="font-black text-xl">Contact Support</h4>
                <a id="support-link" href="#" target="_blank" class="btn-p block mt-8">Message Admin</a>
            </div>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white/80 backdrop-blur-xl border-t h-20 flex justify-around items-center z-[1000]">
            <button onclick="nav('store', this)" class="nav-btn text-indigo-600 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-store text-xl"></i>Store</button>
            <button onclick="nav('history', this)" class="nav-btn text-slate-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-box text-xl"></i>Orders</button>
            <button onclick="nav('help', this)" class="nav-btn text-slate-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-headset text-xl"></i>Help</button>
            <button type="button" id="admin-btn-nav" onclick="openAdmin()" class="hidden text-slate-400 flex flex-col items-center gap-1 font-bold text-[10px]"><i class="fa-solid fa-user-shield text-xl"></i>Admin</button>
        </nav>
    </div>

    <div id="admin-panel" class="fixed inset-0 bg-slate-50 z-[5000] hidden flex flex-col">
        <div class="p-6 flex justify-between items-center bg-white border-b gap-3">
            <div>
                <h2 class="font-black text-xl">Admin Control</h2>
                <p id="admin-status" class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-widest">Checking admin access...</p>
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="forceRefreshAdmin()" class="w-10 h-10 bg-slate-100 rounded-full font-bold text-xs" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
                <button onclick="closeAdmin()" class="w-10 h-10 bg-slate-100 rounded-full font-bold">&times;</button>
            </div>
        </div>
        <div class="p-4 bg-white">
            <div class="adm-nav">
                <button onclick="admTab('pending', this)" class="adm-tab adm-tab-active">PENDING (<span id="p-count">0</span>)</button>
                <button onclick="admTab('stock', this)" class="adm-tab">STOCK MGMT</button>
                <button onclick="admTab('deposits', this)" class="adm-tab">DEPOSITS (<span id="d-count">0</span>)</button>
                <button onclick="admTab('settings', this)" class="adm-tab">VPN MGMT</button>
            </div>
        </div>
        <div class="p-5 overflow-y-auto flex-1 pb-24">
            <div id="adm-pending" class="adm-content space-y-4"></div>
            <div id="adm-deposits" class="adm-content hidden space-y-4"></div>
            <div id="adm-stock" class="adm-content hidden space-y-6">
                <div class="card space-y-3">
                    <b class="text-xs">Add to Stock</b>
                    <input type="text" id="stock-email" placeholder="Email / ID" class="adm-mini-input">
                    <input type="text" id="stock-pass" placeholder="Password" class="adm-mini-input">
                    <select id="stock-vpn-id" class="adm-mini-input"></select>
                    <button onclick="addStock()" class="btn-p py-3 text-xs">Save Stock</button>
                </div>
                <div id="stock-inventory-list" class="space-y-3"></div>
            </div>
            <div id="adm-settings" class="adm-content hidden space-y-6">
                <div class="card space-y-3">
                    <b class="text-[10px] uppercase">General Settings</b>
                    <input type="text" id="set-support-url" placeholder="Support Telegram Link" class="adm-mini-input">
                    <button onclick="saveSupport()" class="btn-p py-2 text-xs">Save Link</button>
                    <hr>
                    <div class="flex gap-2"><input type="text" id="pay-name" placeholder="Bkash" class="w-1/2 adm-mini-input"><input type="text" id="pay-num-in" placeholder="Number" class="w-1/2 adm-mini-input"></div>
                    <input type="text" id="pay-logo-in" placeholder="Payment Logo URL (optional)" class="adm-mini-input">
                    <button onclick="addPay()" class="btn-p py-2 text-xs">Add Method</button>
                    <div id="pay-list" class="space-y-2 mt-2"></div>
                </div>
                <div class="card space-y-3">
                    <input type="text" id="v-name" placeholder="VPN Brand Name" class="adm-mini-input">
                    <div class="flex items-center gap-2">
                        <img id="vprev-new" class="w-10 h-10 rounded-xl logo-img flex-none" alt="">
                        <input type="hidden" id="vlogo-new" value="">
                        <input type="text" id="vlogourl-new" placeholder="Custom logo URL (optional)" class="adm-mini-input" oninput="syncLogo('new',this.value)">
                        <label class="logo-up" title="Upload logo"><i class="fa-solid fa-upload"></i><input type="file" accept="image/*" class="hidden" onchange="pickLogo('new',this)"></label>
                    </div>
                    <button onclick="addVpn()" class="btn-p py-3 text-xs">Create VPN Brand</button>
                </div>
                <div id="adm-vpn-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="tg-lock" style="display:none;position:fixed;inset:0;z-index:10000;background:#020a1f;align-items:center;justify-content:center;padding:32px;text-align:center">
        <div class="card" style="max-width:340px"><i class="fa-brands fa-telegram" style="font-size:64px;color:#60a5fa"></i><h2 class="font-black text-xl mt-4">Open in Telegram</h2><p class="text-xs mt-2" style="color:#93a9cf">This store only works inside the Telegram Mini App.</p></div>
    </div>
    <div id="dep-modal" class="modal"><div class="sheet text-center">
        <div class="flex justify-between items-center mb-5"><h3 class="font-black text-xl">Add Money</h3><button onclick="this.closest('.modal').style.display='none'">&times;</button></div>
        <div id="dep-pay-options" class="grid grid-cols-2 gap-3 mb-5"></div>
        <div id="dep-details" class="hidden">
            <div id="dep-method-wrap" class="mb-4"></div>
            <div class="bg-indigo-50 p-5 rounded-3xl mb-4" onclick="copyText(document.getElementById('dep-num').innerText)"><b id="dep-num" class="text-2xl text-indigo-700"></b></div>
            <input type="number" id="dep-amount" min="1" placeholder="Amount (৳)" class="adm-mini-input mb-3" style="padding:14px;font-size:14px;text-align:center">
            <input type="text" id="dep-trx" placeholder="Transaction ID" class="adm-mini-input mb-4 uppercase" style="padding:14px;font-size:14px;text-align:center">
            <button onclick="submitDeposit()" class="btn-p">Submit Deposit</button>
        </div>
        <div id="dep-history" class="space-y-2 mt-5 text-left"></div>
    </div></div>

                            <div class="grid grid-cols-2 gap-2 text-[10px]"><div class="bg-slate-50 p-2 rounded-xl"><b>Amount</b><br>৳${esc(x.amount)}</div><div class="bg-slate-50 p-2 rounded-xl"><b>UID</b><br>${esc(x.uid || '')}</div></div>
                            <p class="text-[10px]">${esc(x.date || '')}</p>
                            <div class="flex gap-2"><button onclick="approveDeposit('${id}')" class="btn-p py-3 text-[10px]">Approve</button><button onclick="rejectDeposit('${id}')" class="btn-reject">Reject</button></div>
                        </div>`;
                    }
                    if (x.uid == UID) {
                        cur[id] = x.st;
                        const c = x.st === 'Approved' ? 'text-emerald-500' : (x.st === 'Rejected' ? 'text-rose-400' : 'text-indigo-600');
                        hist.innerHTML += `<div class="flex justify-between text-[11px] p-3 bg-slate-50 rounded-xl font-bold"><span>৳${esc(x.amount)} - ${esc(x.method || '')}</span><span class="${c}">${esc(x.st)}</span></div>`;
                    }
                });
                if (!aD.innerHTML) aD.innerHTML = '<div class="admin-empty">No pending deposits.</div>';
                if (hist.innerHTML) hist.innerHTML = '<p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Your deposits</p>' + hist.innerHTML;
                document.getElementById('d-count').innerText = pc;
                if (ready) Object.keys(cur).forEach(id => {
                    if (prev[id] && prev[id] !== cur[id]) {
                        if (cur[id] === 'Approved') notify('Deposit approved', 'success', 'Wallet balance updated.');
                        if (cur[id] === 'Rejected') notify('Deposit rejected', 'error', 'Please contact support.');
                    }
                });
                prev = cur; ready = true;
            }, (err) => dbError('Deposits', err));
        }
        window.openDeposit = () => { depMethod = ''; document.getElementById('dep-details').classList.add('hidden'); document.querySelectorAll('#dep-pay-options .pay-card').forEach(c => c.classList.remove('active')); document.getElementById('dep-modal').style.display = 'flex'; };
        window.setDep = (n, m, logo = '', el = null) => {
            depMethod = n; document.querySelectorAll('#dep-pay-options .pay-card').forEach(c => c.classList.remove('active')); if (el) el.classList.add('active');
            document.getElementById('dep-num').innerText = m;
            document.getElementById('dep-method-wrap').innerHTML = `<span class="active-method-pill">${logoMarkup(logo || getPaymentLogo(n), n)} ${esc(n)} selected</span>`;
            document.getElementById('dep-details').classList.remove('hidden');
        };
        window.submitDeposit = () => {
            const amount = Number(document.getElementById('dep-amount').value), trx = document.getElementById('dep-trx').value.trim();
            if (!depMethod) return notify('Select payment method first', 'warning');
            if (!(amount > 0)) return notify('Enter a valid amount', 'warning');
            if (!trx) return notify('Enter Transaction ID', 'warning');
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            push(ref(db, 'deposits'), { uid: UID, user: UNAME, method: depMethod, amount, trx: trx.toUpperCase(), st: 'Pending', date: dateStr }).then(() => {
                document.getElementById('dep-amount').value = ''; document.getElementById('dep-trx').value = ''; document.getElementById('dep-details').classList.add('hidden');
                notify('Deposit request sent', 'success', 'Admin will review it.');
            }).catch(err => dbError('Deposit', err));
        };
        window.approveDeposit = async (id) => {
            if (!isAdmin()) return;
            try {
                let won = false, info = null;
                await runTransaction(ref(db, `deposits/${id}`), (d) => { won = false; if (d && d.st === 'Pending') { d.st = 'Approved'; won = true; info = { uid: d.uid, amount: Number(d.amount) }; } return d; });
                if (!won) return notify('Already handled', 'warning');
                await runTransaction(ref(db, `users/${info.uid}/balance`), (b) => (Number(b) || 0) + info.amount);
                notify('Deposit approved', 'success');
            } catch (err) { dbError('Approve deposit', err); }
        };
        window.rejectDeposit = async (id) => {
            if (!isAdmin()) return;
            try {
                await runTransaction(ref(db, `deposits/${id}`), (d) => { if (d && d.st === 'Pending') d.st = 'Rejected'; return d; });
                notify('Deposit rejected', 'success');
            } catch (err) { dbError('Reject deposit', err); }
        };

        // ----- quantity + wallet payment -----
        let curQty = 1, curMax = 1;
        function refreshQty() {
            const t = Number(curPr) * curQty;
            document.getElementById('qty-n').innerText = curQty;
            document.getElementById('qty-total').innerText = 'Total ৳' + t;
            document.getElementById('target-price').innerText = 'Total: ৳' + t + (curQty > 1 ? ` (${curQty} x ৳${curPr})` : '');
            document.getElementById('wallet-pay-btn').innerText = 'Pay ৳' + t + ' from wallet';
        }
        window.chQty = (d) => {
            const n = curQty + d; if (n < 1) return;
            if (n > curMax) return notify('Only ' + curMax + ' in stock', 'warning');
            curQty = n; refreshQty();
        };
        window.goPay = async (n, p) => {
            let c = 0;
            try { const sn = await get(ref(db, `vpns/${curVid}/stock`)); c = sn.exists() ? Object.keys(sn.val()).length : 0; } catch (e) {}
            if (c < 1) return notify('Out of stock', 'warning');
            curPl = n; curPr = Number(p); curMethod = ''; curQty = 1; curMax = Math.min(c, 10);
            document.getElementById('plan-modal').style.display = 'none'; document.getElementById('pay-modal').style.display = 'flex';
            document.getElementById('pay-details').classList.add('hidden'); document.getElementById('active-method-wrap').innerHTML = '';
            document.querySelectorAll('#user-pay-options .pay-card').forEach(c2 => c2.classList.remove('active'));
            refreshQty();
        };
        window.payWallet = async () => {
            const total = Number(curPr) * curQty; if (!(total > 0)) return notify('Invalid price', 'error');
            try {
                let ok = false;
                await runTransaction(ref(db, `users/${UID}/balance`), (b) => { ok = false; b = Number(b) || 0; if (b < total) return; ok = true; return b - total; });
                if (!ok) return notify('Not enough balance', 'warning', 'Add money first.');
                const now = new Date();
                const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                try {
                    await push(ref(db, 'orders'), { vpn: curV, vpn_id: curVid, plan: curPl, price: curPr, qty: curQty, total, trx: 'WALLET', method: 'Wallet', uid: UID, user: UNAME, st: 'Pending', date: dateStr });
                } catch (e) {
                    await runTransaction(ref(db, `users/${UID}/balance`), (b) => (Number(b) || 0) + total);
                    throw e;
                }
                document.getElementById('pay-modal').style.display = 'none';
                notify('Order placed from wallet', 'success', 'Admin will deliver your account(s).');
            } catch (err) { dbError('Wallet payment', err); }
        };

        window.nav = (pageId, btn) => {
            // Reset all nav buttons
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-indigo-600');
                b.classList.add('text-slate-400');
            });
            // Highlight active button
            btn.classList.remove('text-slate-400');
            btn.classList.add('text-indigo-600');
            // Hide all pages
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            // Show target page
            document.getElementById(pageId + '-page').classList.remove('hidden');
        };

        window.rejectOrder = (id) => {
            Swal.fire({
                title: 'Reject Order?',
                text: "User will see this order as rejected.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Yes, Reject'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                    if (!isAdmin()) return;
                    let won = false, info = null;
                    await runTransaction(ref(db, `orders/${id}`), (o) => { won = false; if (o && o.st === 'Pending') { o.st = 'Rejected'; won = true; info = { method: o.method, uid: o.uid, total: Number(o.total || o.price) || 0 }; } return o; });
                    if (won && info.method === 'Wallet' && info.total > 0) await runTransaction(ref(db, `users/${info.uid}/balance`), (b) => (Number(b) || 0) + info.total);
                    notify(won ? 'Order rejected' : 'Already handled', won ? 'success' : 'warning');
                } catch (err) { dbError('Reject order', err); }
                }
            });
        };

        window.saveV = (id) => update(ref(db,`vpns/${id}`), { 
            p1n: document.getElementById(`p1n-${id}`).value.trim(), p1p: document.getElementById(`p1p-${id}`).value.trim(),
            logo: (document.getElementById(`vlogo-${id}`)?.value || '').trim() || null,
            p2n: document.getElementById(`p2n-${id}`).value.trim(), p2p: document.getElementById(`p2p-${id}`).value.trim()
        }).then(() => notify('VPN configuration updated', 'success')).catch(err => dbError('Update VPN', err));

        window.addStock = () => {
            const e = document.getElementById('stock-email').value.trim(), p = document.getElementById('stock-pass').value.trim(), vid = document.getElementById('stock-vpn-id').value;
            if(!vid) return notify('Create a VPN brand first', 'warning');
            if(!e || !p) return notify('Enter email and password', 'warning');
            push(ref(db, `vpns/${vid}/stock`), { email: e, pass: p }).then(() => {
                document.getElementById('stock-email').value = ''; document.getElementById('stock-pass').value = '';
                notify('Stock added successfully', 'success');
            }).catch(err => dbError('Add stock', err));
        };

        let curV, curPl, curPr, curVid, curMethod;
        window.openPlans = (id) => {
            get(ref(db,`vpns/${id}`)).then(s => {
                const v = s.val(); curV = v.name; curVid = id;
                let h = `<div class="flex justify-between items-center mb-6"><div class="flex items-center gap-3"><img src="${esc(getVpnLogo(v.name, v.logo))}" data-n="${esc(v.name)}" onerror="imgFallback(this)" class="w-10 h-10 rounded-lg logo-img"><h3 class="font-black text-xl">${v.name}</h3></div><button onclick="this.closest('.modal').style.display='none'">&times;</button></div>`;
                if(v.p1n) h += `<div onclick="goPay('${v.p1n}','${v.p1p}')" class="card bg-indigo-50 mb-3 p-5 flex justify-between items-center"><span>${v.p1n}</span><b class="text-indigo-600">৳${v.p1p}</b></div>`;
                if(v.p2n) h += `<div onclick="goPay('${v.p2n}','${v.p2p}')" class="card bg-indigo-50 mb-3 p-5 flex justify-between items-center"><span>${v.p2n}</span><b class="text-indigo-600">৳${v.p2p}</b></div>`;
                document.getElementById('plan-content').innerHTML = h; document.getElementById('plan-modal').style.display = 'flex';
            });
        };

        window.setPay = (n, m, logo = '', el = null) => { curMethod = n; document.querySelectorAll('.pay-card').forEach(card => card.classList.remove('active')); if(el) el.classList.add('active'); document.getElementById('active-num').innerText = m; document.getElementById('active-method-wrap').innerHTML = `<span class="active-method-pill">${logoMarkup(logo || getPaymentLogo(n), n)} ${esc(n)} selected</span>`; document.getElementById('pay-details').classList.remove('hidden'); notify(`${n} selected`, 'success'); };
        
        window.orderNow = () => {
            const trx = document.getElementById('trx-id').value.trim(); if(!curMethod) return notify('Select payment method first', 'warning'); if(!trx) return notify('Enter Transaction ID', 'warning');
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            push(ref(db, 'orders'), { vpn: curV, vpn_id: curVid, plan: curPl, price: curPr, qty: curQty, total: curPr * curQty, trx: trx.toUpperCase(), method: curMethod, uid: UID, user: UNAME, st: "Pending", date: dateStr }).then(() => {
                notify('Order sent successfully', 'success', 'Admin will review your payment.'); document.getElementById('pay-modal').style.display = 'none';
                document.getElementById('trx-id').value = '';
            }).catch(err => dbError('Create order', err));
        };

        window.showStockList = async (orderId, vpnId, qty = 1) => {
            if (!isAdmin()) return;
            const content = document.getElementById('stock-select-content');
            let h = `<div class="mb-4 font-bold flex justify-between">Select ${qty} account(s) <button onclick="this.closest('.modal').style.display='none'">&times;</button></div>`;
            if (!vpnId) {
                content.innerHTML = h + `<p class="text-rose-500 text-sm font-bold">This order has no VPN ID. Reject it or ask user to order again.</p>`;
                document.getElementById('stock-select-modal').style.display = 'flex';
                return;
            }
            try {
                const snap = await get(ref(db, `vpns/${vpnId}/stock`));
                if (snap.exists()) {
                    Object.keys(snap.val()).forEach(sk => {
                        const stock = snap.val()[sk] || {};
                        h += `<label class="flex items-center gap-3 w-full p-4 bg-slate-50 mb-2 rounded-xl font-bold text-xs"><input type="checkbox" class="stk-pick" value="${sk}"> ${esc(stock.email || 'No email')}</label>`;
                    });
                    h += `<button onclick="approveSelected('${orderId}','${vpnId}',${Number(qty) || 1})" class="btn-p mt-3">Deliver</button>`;
                } else h += `<p class="text-rose-500 text-sm font-bold">Stock empty! Add stock first.</p>`;
                content.innerHTML = h; document.getElementById('stock-select-modal').style.display = 'flex';
            } catch (err) { dbError('Load stock', err); }
        };

        window.approveSelected = async (orderId, vpnId, qty) => {
            if (!isAdmin()) return;
            const keys = [...document.querySelectorAll('.stk-pick:checked')].map(i => i.value);
            if (keys.length !== qty) return notify(`Select exactly ${qty} account(s)`, 'warning');
            try {
                const accounts = [];
                for (const k of keys) {
                    const sn = await get(ref(db, `vpns/${vpnId}/stock/${k}`));
                    if (!sn.exists()) return notify('Selected stock not found', 'error');
                    accounts.push({ email: sn.val().email, pass: sn.val().pass });
                }
                await update(ref(db, `orders/${orderId}`), { st: "Approved", email: accounts[0].email, pass: accounts[0].pass, accounts });
                for (const k of keys) await remove(ref(db, `vpns/${vpnId}/stock/${k}`));
                document.getElementById('stock-select-modal').style.display = 'none';
                notify('Account(s) delivered successfully', 'success');
            } catch (err) { dbError('Approve order', err); }
        };

        window.toggleV = (id, val) => update(ref(db, `vpns/${id}`), { status: val ? "ON" : "OFF" }).then(() => notify(val ? 'VPN is online' : 'VPN is offline', 'success')).catch(err => dbError('Toggle VPN', err));
        window.saveSupport = () => set(ref(db, 'supportUrl'), document.getElementById('set-support-url').value.trim()).then(() => notify('Support link saved', 'success')).catch(err => dbError('Save support link', err));
        window.addPay = () => { const n = document.getElementById('pay-name').value.trim(), m = document.getElementById('pay-num-in').value.trim(), l = document.getElementById('pay-logo-in').value.trim(); if(n&&m) push(ref(db,'payments'),{name:n,num:m,logo:l}).then(() => { document.getElementById('pay-name').value=''; document.getElementById('pay-num-in').value=''; document.getElementById('pay-logo-in').value=''; notify('Payment method added', 'success'); }).catch(err => dbError('Add payment', err)); else notify('Add payment name and number', 'warning'); };
        window.delPay = (id) => remove(ref(db,`payments/${id}`)).then(() => notify('Payment method removed', 'success')).catch(err => dbError('Delete payment', err));
        window.addVpn = () => { const n = document.getElementById('v-name').value.trim(); if(!n) return notify('Enter VPN brand name', 'warning'); const logo = (document.getElementById('vlogo-new')?.value || '').trim(); const data = {name:n, status: "ON"}; if (logo) data.logo = logo; push(ref(db,'vpns'), data).then(() => { document.getElementById('v-name').value=''; const u = document.getElementById('vlogourl-new'); if (u) u.value=''; const h = document.getElementById('vlogo-new'); if (h) h.value=''; const p = document.getElementById('vprev-new'); if (p) p.src = letterLogo('V'); notify('VPN brand created', 'success'); }).catch(err => dbError('Add VPN', err)); };
        window.delV = (id) => {
            Swal.fire({ title: 'Delete VPN brand?', text: 'This will also remove saved stock under this VPN.', icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete' }).then(result => {
                if(result.isConfirmed) remove(ref(db,`vpns/${id}`)).then(() => notify('VPN brand deleted', 'success')).catch(err => dbError('Delete VPN', err));
            });
        };
        window.delStockItem = (vid, skey) => remove(ref(db, `vpns/${vid}/stock/${skey}`)).then(() => notify('Stock item removed', 'success')).catch(err => dbError('Delete stock', err));
        window.forceRefreshAdmin = () => { updateAdminStatus(); notify('Admin panel refreshed', 'success'); };
        
        window.admTab = (t, btn) => {
            document.querySelectorAll('.adm-tab').forEach(b => b.classList.remove('adm-tab-active'));
            btn.classList.add('adm-tab-active');
            document.querySelectorAll('.adm-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('adm-'+t).classList.remove('hidden');
        };
        function showAdminPanel() {
            const panel = document.getElementById('admin-panel');
            if (!panel) return notify('Admin panel not found', 'error');
            panel.classList.remove('hidden');
            panel.style.display = 'flex';
            panel.style.position = 'fixed';
            panel.style.inset = '0';
            panel.style.zIndex = '9000';
            document.body.style.overflow = 'hidden';
        }
        window.openAdmin = () => {
            if (!isAdmin()) return;
            updateAdminStatus();
            showAdminPanel();
        };
        window.closeAdmin = () => {
            const panel = document.getElementById('admin-panel');
            if (!panel) return;
            panel.classList.add('hidden');
            panel.style.display = 'none';
            document.body.style.overflow = '';
        };

        document.addEventListener('DOMContentLoaded', () => {
            const adminBtn = document.getElementById('admin-btn-nav');
            if (adminBtn) {
                adminBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    window.openAdmin();
                });
            }
        });
        window.copyText = (t) => { navigator.clipboard.writeText(t); notify('Copied', 'success'); };
    </script>
</body>
</html>
